<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);padding:16px;font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sw{aspect-ratio:1.2/1;border-radius:4px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-mono);font-size:10px}
.sw .n{font-weight:500}.sw .h{opacity:0.8}
.light{color:#132E08}.dark{color:#F4F6E6}
</style></head>
<body>
<div class="grid">
  <div class="sw light" style="background:#EDFAE2"><div class="n">loop·50</div><div class="h">#EDFAE2</div></div>
  <div class="sw light" style="background:#D2F3B0"><div class="n">loop·100</div><div class="h">#D2F3B0</div></div>
  <div class="sw light" style="background:#A7E674"><div class="n">loop·200</div><div class="h">#A7E674</div></div>
  <div class="sw light" style="background:#7ED647"><div class="n">loop·300</div><div class="h">#7ED647</div></div>
  <div class="sw dark" style="background:#43A314"><div class="n">loop·500 ◆</div><div class="h">#43A314</div></div>
  <div class="sw dark" style="background:#35810E"><div class="n">loop·600</div><div class="h">#35810E</div></div>
  <div class="sw dark" style="background:#295F0B"><div class="n">loop·700</div><div class="h">#295F0B</div></div>
  <div class="sw dark" style="background:#1D420A"><div class="n">loop·800</div><div class="h">#1D420A</div></div>
  <div class="sw dark" style="background:#132E08"><div class="n">loop·900</div><div class="h">#132E08</div></div>
  <div class="sw dark" style="background:#0B0D0A"><div class="n">vault·950</div><div class="h">#0B0D0A</div></div>
</div>
</body></html>
