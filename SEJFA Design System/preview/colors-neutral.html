<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);padding:16px;font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.sw{aspect-ratio:1.2/1;border-radius:4px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-mono);font-size:10px}
.sw .n{font-weight:500}
.sw .h{opacity:0.7;letter-spacing:0.03em}
.light{color:var(--fg1)}.dark{color:#fff}
</style></head>
<body>
<div class="grid">
  <div class="sw light" style="background:#EBE6CE"><div class="n">100</div><div class="h">#EBE6CE</div></div>
  <div class="sw light" style="background:#DCD6BE"><div class="n">200</div><div class="h">#DCD6BE</div></div>
  <div class="sw light" style="background:#C9C3AA"><div class="n">300</div><div class="h">#C9C3AA</div></div>
  <div class="sw light" style="background:#A8A185"><div class="n">400</div><div class="h">#A8A185</div></div>
  <div class="sw dark" style="background:#7C7660"><div class="n">500</div><div class="h">#7C7660</div></div>
  <div class="sw dark" style="background:#55513F"><div class="n">600</div><div class="h">#55513F</div></div>
  <div class="sw dark" style="background:#3A372E"><div class="n">700</div><div class="h">#3A372E</div></div>
  <div class="sw dark" style="background:#14130F"><div class="n">900</div><div class="h">#14130F</div></div>
</div>
</body></html>
