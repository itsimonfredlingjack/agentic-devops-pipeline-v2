<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);padding:16px;font-family:var(--font-sans)}
.row{display:flex;gap:10px;align-items:stretch}
.sem{flex:1;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.12em;opacity:0.75}
.val{font-family:var(--font-mono);font-size:12px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;margin-bottom:8px}
</style></head>
<body>
<div class="row">
  <div class="sem" style="background:#EDFAE2;color:#132E08;border:1px solid #A7E674">
    <div><div class="dot" style="background:#43A314"></div><div class="lbl">ok / success</div></div>
    <div class="val">--ok · #43A314</div>
  </div>
  <div class="sem" style="background:#FDF4E2;color:#4a2f00;border:1px solid #F2C96A">
    <div><div class="dot" style="background:#D9992A"></div><div class="lbl">warn / healing</div></div>
    <div class="val">--warn · #D9992A</div>
  </div>
  <div class="sem" style="background:#FBE9E6;color:#4a0e08;border:1px solid #E6A69D">
    <div><div class="dot" style="background:#C8372E"></div><div class="lbl">error</div></div>
    <div class="val">--err · #C8372E</div>
  </div>
  <div class="sem" style="background:#E8F1FA;color:#0b2a47;border:1px solid #A9C6E4">
    <div><div class="dot" style="background:#3E7FBF"></div><div class="lbl">info</div></div>
    <div class="val">--info · #3E7FBF</div>
  </div>
</div>
</body></html>
