<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--fg1);padding:16px;display:flex;align-items:center;justify-content:center;min-height:150px}
  .wrap{display:flex;gap:14px;align-items:center}
  .mark{flex:0 0 auto}
  .wm{font-family:var(--font-mono);font-size:40px;font-weight:500;letter-spacing:-0.5px;line-height:1}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--fg3);margin-top:6px}
</style></head>
<body>
  <div class="wrap">
    <img class="mark" src="../assets/logo-mark.svg" width="72" height="72" alt="SEJFA">
    <div>
      <div class="wm">SEJFA</div>
      <div class="tag">Agentic · DevOps · Loop</div>
    </div>
  </div>
</body></html>
