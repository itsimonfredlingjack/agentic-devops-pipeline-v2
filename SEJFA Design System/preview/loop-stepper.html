<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);padding:14px;font-family:var(--font-sans);color:var(--fg1)}
.loop{display:grid;grid-template-columns:repeat(6,1fr);gap:0;align-items:center}
.node{position:relative;padding:10px 6px;text-align:center;border:1px dashed var(--ink-300);border-right:0;background:var(--bg-raised)}
.node:last-child{border-right:1px dashed var(--ink-300)}
.node.active{background:#fff;border-style:solid;border-color:var(--loop-500);box-shadow:0 2px 10px rgba(67,163,20,0.15);z-index:1}
.n{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--fg3);margin-bottom:4px}
.t{font-family:var(--font-mono);font-size:12px;font-weight:500}
.node.active .n{color:var(--loop-600)}
.legend{margin-top:10px;font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.1em;display:flex;gap:14px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
</style></head>
<body>
<div class="loop">
  <div class="node"><div class="n">01</div><div class="t">JIRA</div></div>
  <div class="node"><div class="n">02</div><div class="t">BRANCH</div></div>
  <div class="node active"><div class="n">03 · now</div><div class="t">TDD LOOP</div></div>
  <div class="node"><div class="n">04</div><div class="t">PR</div></div>
  <div class="node"><div class="n">05</div><div class="t">JULES</div></div>
  <div class="node"><div class="n">06</div><div class="t">DEPLOY</div></div>
</div>
<div class="legend"><span><span class="dot" style="background:var(--loop-500)"></span>active</span><span><span class="dot" style="background:var(--ink-300)"></span>queued</span><span>ralph loop · never give up</span></div>
</body></html>
