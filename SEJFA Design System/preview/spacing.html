<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);padding:16px;font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar{height:14px;background:var(--vault-900);border-radius:2px}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg3);width:60px;flex:0 0 60px;text-transform:uppercase;letter-spacing:0.1em}
.px{font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-left:8px}
</style></head>
<body>
<div class="row"><div class="lbl">s-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
<div class="row"><div class="lbl">s-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
<div class="row"><div class="lbl">s-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
<div class="row"><div class="lbl">s-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
<div class="row"><div class="lbl">s-6</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
<div class="row"><div class="lbl">s-8</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
<div class="row"><div class="lbl">s-12</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
<div class="row"><div class="lbl">s-16</div><div class="bar" style="width:64px"></div><div class="px">64px</div></div>
</body></html>
