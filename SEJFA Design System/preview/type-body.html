<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);padding:18px;color:var(--fg1);font-family:var(--font-sans)}
.row{display:flex;align-items:baseline;gap:14px;margin:0 0 10px}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.12em;width:74px;flex:0 0 74px}
.body{font-size:16px;line-height:1.55}
.sm{font-size:14px;line-height:1.55;color:var(--fg2)}
.xs{font-size:13px;line-height:1.5;color:var(--fg3)}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.12em}
</style></head>
<body>
<div class="row"><div class="lbl">body · 16</div><div class="body">The agent takes a Jira ticket, runs the inner loop, opens the PR.</div></div>
<div class="row"><div class="lbl">body-sm · 14</div><div class="sm">Secondary prose sits a half-step lower, a hair softer.</div></div>
<div class="row"><div class="lbl">body-xs · 13</div><div class="xs">Meta, helper text, captions — the lowest tier.</div></div>
<div class="row"><div class="lbl">meta · 11</div><div class="meta">feature/ge-42-subscriber-crud</div></div>
</body></html>
