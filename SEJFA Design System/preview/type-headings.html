<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0}
body{background:var(--bg);padding:18px;color:var(--fg1)}
.row{display:flex;align-items:baseline;gap:14px;margin:0 0 6px}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.12em;width:74px;flex:0 0 74px}
.h1{font-family:var(--font-mono);font-size:32px;font-weight:500;letter-spacing:-0.02em;line-height:1.1}
.h2{font-family:var(--font-mono);font-size:24px;font-weight:500;letter-spacing:-0.02em;line-height:1.15}
.h3{font-family:var(--font-mono);font-size:18px;font-weight:500;line-height:1.2}
.h4{font-family:var(--font-sans);font-size:16px;font-weight:600;line-height:1.25}
</style></head>
<body>
<div class="row"><div class="lbl">h1 · mono 36</div><div class="h1">GE-42 ready for review</div></div>
<div class="row"><div class="lbl">h2 · mono 28</div><div class="h2">Pipeline · run #1284</div></div>
<div class="row"><div class="lbl">h3 · mono 22</div><div class="h3">Ralph Wiggum Loop iter 7</div></div>
<div class="row"><div class="lbl">h4 · sans 18</div><div class="h4">Subscriber settings</div></div>
</body></html>
